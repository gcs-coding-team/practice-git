<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>マイボタン</title>
  <link rel="stylesheet" href="https://googleapis.com" />
  <style>
    /* ③タスク属性セレクト機能のCSS */
    .square-btn {
      background-color: silver;
      color: black;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 100px;
    }
    .square-btn:hover {
      background-color: #3399FF;
    }
  </style>
</head>
<body>

  <!-- ①タイトル部分 -->
  <p style="margin: 0; line-height: 1.3;">
    <span style="font-family: 'gg sans', sans-serif; color: #5865F2; font-weight: bold; font-size: 12px; letter-spacing: 0.5px;">ACCOUNT</span><br>
    <span style="font-family: 'gg sans', sans-serif; color: black; font-weight: bold; font-size: 32px;">アカウント</span><br>
    <span style="font-family: 'gg sans', sans-serif; color: #b5bac1; font-size: 14px;">ユーザー情報とログイン状態を管理します。</span>
  </p>

  <!-- ②編集・削除ボタン部分 -->
  <div style="display: flex; justify-content: center; align-items: center; min-height: 50vh;">
    <div style="border: 0.5px solid #333; padding: 20px; background-color: #f9f9f9; border-radius: 8px;">
      <input type="text" id="myInput">
      <button id="editBtn">編集</button>
      <button id="deleteBtn">削除</button>
    </div>
  </div>

  <!-- ③タスク属性セレクト機能部分 -->
  <div>
    <button class="square-btn">すべて</button>
    <button class="square-btn">未完了</button>
    <button class="square-btn">完了</button>
  </div>

  <script>
    /* ②編集・削除ボタンのJavaScript */
    const inputField = document.getElementById('myInput');
    const editButton = document.getElementById('editBtn');
    const deleteButton = document.getElementById('deleteBtn');

    editButton.addEventListener('click', () => {
      inputField.focus(); 
    });

    deleteButton.addEventListener('click', () => {
      inputField.value = "";
    });
  </script>
</body>
</html>
